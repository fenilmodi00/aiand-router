# Public catalog prices: https://docs.aiand.com/models/catalog/
# AA scores are public priors, not aiand-hosted measurements.
# No free models. Motif-3 is on this org catalog (ping + tools ok 2026-08-13).

virtual_model: router/auto
fallback_model: deepseek-ai/deepseek-v4-flash
max_tokens_limit: 32768
upstream_timeout_s: 120
redact_keys:
  - key
  - authorization
  - token
  - secret

max_regret: 8
trained_effort:
  low: {threshold: 0.05, max_regret: 0.30}
  # Keep 0.10: after hard-cal refit, Kimi P on edit-cal sits ~0.09 → Flash fallback
  # on cost-gold while verified (higher Kimi P) still routes to Kimi. Cost bar needs
  # trained cheaper than rules-Pro (priors below).
  medium: {threshold: 0.10, max_regret: 0.20}
  high: {threshold: 0.20, max_regret: 0.15}
  max: {threshold: 0.60, max_regret: 0.03}
latency_limit_ms: 0
phase_threshold:
  discover: 35
  repository_discovery: 35
  repository_summary: 30
  intent: 40
  plan: 50
  planning: 50
  edit: 40
  code_generation: 40
  code_edit: 40
  refactoring: 40
  security_review: 50
  tool: 38
  tool_call: 38
  test_execution: 0
  debug: 50
  debugging: 50
  test_failure_analysis: 53
  summarize: 24
  final_summary: 24

# K3 only when the bar is at least this, or routing_effort=max
premium_aa_floor: 58
# After a reported test failure, debug must clear this (above Flash's AA 52)
debug_fail_threshold: 53

