max_tokens_limit: 32768
upstream_timeout_s: 120
redact_keys:
  - key
  - authorization
  - token
  - secret

phase_threshold:
  discover: 35
  plan: 50
  edit: 40
  tool: 38
  debug: 50
  summarize: 24

